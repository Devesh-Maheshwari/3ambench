apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: service-health
  namespace: monitoring
  labels:
    role: alert-rules
spec:
  groups:
  - name: service-health
    rules:
    - alert: ExportEdgeDown
      expr: sum by (service) (up{service="export-edge"}) == 0 or absent(up{service="export-edge"})
      for: 3m
      labels:
        severity: page
        team: search-infra
      annotations:
        summary: '{{ $labels.service }} has no healthy scrape targets'
        runbook_url: https://runbooks.northwind-freight.dev/alerts/ExportEdgeDown
    - alert: RefundGwDown
      expr: sum by (service) (up{service="refund-gw"}) == 0 or absent(up{service="refund-gw"})
      for: 3m
      labels:
        severity: page
        team: logistics
      annotations:
        summary: '{{ $labels.service }} has no healthy scrape targets'
        runbook_url: https://runbooks.northwind-freight.dev/alerts/RefundGwDown
