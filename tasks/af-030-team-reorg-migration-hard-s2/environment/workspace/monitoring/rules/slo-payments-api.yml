groups:
- name: slo-payments-api
  rules:
  - alert: PaymentsApiErrorBudgetBurnFast
    expr: slo:sli_error:ratio_rate1h{service="payments-api"} > (14.4 * 0.005) and slo:sli_error:ratio_rate5m{service="payments-api"} > (14.4 * 0.005)
    labels:
      severity: page
      team: storefront
      slo: payments-api-availability
    annotations:
      summary: '{{ $labels.service }} is burning its error budget fast (14.4x over 1h and 5m)'
      runbook_url: https://runbooks.tidewater.dev/alerts/PaymentsApiErrorBudgetBurnFast
