apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: kafka
  namespace: monitoring
  labels:
    role: alert-rules
spec:
  groups:
  - name: kafka
    rules:
    - alert: KafkaTopicsReplicas
      expr: sum by (topic) (kafka_topic_partition_in_sync_replica) < 3
      labels:
        severity: page
        team: infra
      annotations:
        summary: Topic {{ $labels.topic }} under-replicated
        runbook_url: https://runbooks.quillon.example/alerts/KafkaTopicsReplicas
    - alert: KafkaConsumersGroupLag
      expr: sum by (consumergroup) (kafka_consumergroup_lag) > 50000
      for: 1m
      labels:
        severity: warning
        team: infra
      annotations:
        summary: Consumer group {{ $labels.consumergroup }} lagging
        runbook_url: https://runbooks.quillon.example/alerts/KafkaConsumersGroupLag
    - alert: KafkaBrokerDown
      expr: count(kafka_broker_info) < 3
      for: 2m
      labels:
        severity: page
        team: infra
      annotations:
        summary: Kafka broker count dropped
        runbook_url: https://runbooks.quillon.example/alerts/KafkaBrokerDown
    - alert: KafkaOfflinePartitions
      expr: sum(kafka_controller_kafkacontroller_offlinepartitionscount) > 0
      for: 1m
      labels:
        severity: page
        team: infra
      annotations:
        summary: Kafka has offline partitions
        runbook_url: https://runbooks.quillon.example/alerts/KafkaOfflinePartitions
