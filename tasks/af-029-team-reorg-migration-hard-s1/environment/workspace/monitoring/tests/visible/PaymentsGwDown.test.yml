rule_files:
- ../../rules/*.yml
- ../../rules/*.yaml
evaluation_interval: 1m
tests:
- name: PaymentsGwDown all_down
  interval: 1m
  input_series:
  - series: up{instance="10.116.122.2:8080",job="payments-gw",namespace="staging",service="payments-gw"}
    values: 1+0x9 0+0x15
  - series: up{instance="10.252.162.3:8080",job="payments-gw",namespace="staging",service="payments-gw"}
    values: 1+0x9 0+0x15
  - series: up{instance="10.168.33.4:8080",job="payments-gw",namespace="staging",service="payments-gw"}
    values: 1+0x9 0+0x15
  - series: up{instance="10.141.135.2:8080",job="ingest-edge",namespace="staging",service="ingest-edge"}
    values: 1+0x25
  - series: up{instance="10.115.130.3:8080",job="ingest-edge",namespace="staging",service="ingest-edge"}
    values: 1+0x25
  promql_expr_test:
  - expr: count(ALERTS{alertname="PaymentsGwDown",alertstate="firing",service="payments-gw"}) or vector(0)
    eval_time: 25m
    exp_samples:
    - labels: '{}'
      value: 1
