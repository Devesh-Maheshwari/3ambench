rule_files:
- ../../rules/*.yml
- ../../rules/*.yaml
evaluation_interval: 1m
tests:
- name: PricingWorkerDown all_down
  interval: 1m
  input_series:
  - series: up{instance="10.81.163.2:8080",job="pricing-worker",namespace="staging",service="pricing-worker"}
    values: 1+0x9 0+0x15
  - series: up{instance="10.29.241.3:8080",job="pricing-worker",namespace="staging",service="pricing-worker"}
    values: 1+0x9 0+0x15
  - series: up{instance="10.90.219.4:8080",job="pricing-worker",namespace="staging",service="pricing-worker"}
    values: 1+0x9 0+0x15
  - series: up{instance="10.71.109.2:8080",job="tax-svc",namespace="staging",service="tax-svc"}
    values: 1+0x25
  - series: up{instance="10.143.186.3:8080",job="tax-svc",namespace="staging",service="tax-svc"}
    values: 1+0x25
  promql_expr_test:
  - expr: count(ALERTS{alertname="PricingWorkerDown",alertstate="firing",service="pricing-worker"}) or vector(0)
    eval_time: 25m
    exp_samples:
    - labels: '{}'
      value: 1
