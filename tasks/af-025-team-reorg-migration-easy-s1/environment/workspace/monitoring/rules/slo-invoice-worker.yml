groups:
- name: slo-invoice-worker
  rules:
  - alert: InvoiceWorkerErrorBudgetBurnFast
    expr: slo:sli_error:ratio_rate1h{service="invoice-worker"} > (14.4 * 0.001) and slo:sli_error:ratio_rate5m{service="invoice-worker"} > (14.4 * 0.001)
    for: 2m
    labels:
      severity: page
      team: trust-safety
      slo: invoice-worker-availability
    annotations:
      summary: '{{ $labels.service }} is burning its error budget fast (14.4x over 1h and 5m)'
      runbook_url: https://runbooks.larkspur.example/alerts/InvoiceWorkerErrorBudgetBurnFast
  - alert: InvoiceWorkerErrorBudgetBurnSlow
    expr: slo:sli_error:ratio_rate6h{service="invoice-worker"} > (6 * 0.001) and slo:sli_error:ratio_rate30m{service="invoice-worker"} > (6 * 0.001)
    for: 15m
    labels:
      severity: ticket
      team: trust-safety
      slo: invoice-worker-availability
    annotations:
      summary: '{{ $labels.service }} is burning its error budget steadily (6x over 6h and 30m)'
      runbook_url: https://runbooks.larkspur.example/alerts/InvoiceWorkerErrorBudgetBurnSlow
