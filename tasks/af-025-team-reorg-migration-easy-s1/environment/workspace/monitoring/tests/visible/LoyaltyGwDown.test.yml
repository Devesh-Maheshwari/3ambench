rule_files:
- ../../rules/*.yml
- ../../rules/*.yaml
evaluation_interval: 1m
tests:
- name: LoyaltyGwDown all_down
  interval: 1m
  input_series:
  - series: up{instance="10.212.43.2:8080",job="loyalty-gw",namespace="staging",service="loyalty-gw"}
    values: 1+0x9 0+0x15
  - series: up{instance="10.60.154.3:8080",job="loyalty-gw",namespace="staging",service="loyalty-gw"}
    values: 1+0x9 0+0x15
  - series: up{instance="10.97.49.4:8080",job="loyalty-gw",namespace="staging",service="loyalty-gw"}
    values: 1+0x9 0+0x15
  - series: up{instance="10.91.19.2:8080",job="chat-api",namespace="staging",service="chat-api"}
    values: 1+0x25
  - series: up{instance="10.46.131.3:8080",job="chat-api",namespace="staging",service="chat-api"}
    values: 1+0x25
  promql_expr_test:
  - expr: count(ALERTS{alertname="LoyaltyGwDown",alertstate="firing",service="loyalty-gw"}) or vector(0)
    eval_time: 25m
    exp_samples:
    - labels: '{}'
      value: 1
