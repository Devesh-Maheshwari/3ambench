[project]
name = "alertforge-env"
version = "0.1.0"
description = "OpenEnv server for 3amBench (AlertForge): Prometheus alerting-as-code with per-step shaped reward."
requires-python = ">=3.11"
dependencies = ["openenv-core==0.3.0", "fastapi", "uvicorn", "pyyaml>=6.0", "alertforge"]

[project.scripts]
server = "alertforge_env.server.app:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["alertforge_env", "alertforge_env.server"]
package-dir = {"alertforge_env" = "."}
