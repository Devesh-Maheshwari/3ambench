rule_files: [sp23-escape-rules.yml]
evaluation_interval: 1m
tests:
- interval: 1m
  input_series:
  - series: up{job="x"}
    values: 0x20
  alert_rule_test:
  - eval_time: 5m
    alertname: ViaHexEscape
    exp_alerts: [{exp_labels: {alertstate: pending, job: x, severity: page}}]
  - eval_time: 5m
    alertname: ViaOctalEscape
    exp_alerts: [{exp_labels: {alertstate: pending, job: x, severity: page}}]
  - eval_time: 5m
    alertname: ViaUnicodeEscape
    exp_alerts: [{exp_labels: {alertstate: pending, job: x, severity: page}}]
  - eval_time: 5m
    alertname: ViaUnicodeQuotedName
    exp_alerts: [{exp_labels: {alertstate: pending, job: x, severity: page}}]
  - eval_time: 5m
    alertname: ViaQuotedHexName
    exp_alerts: [{exp_labels: {alertstate: pending, job: x, severity: page}}]
  - eval_time: 5m
    alertname: ViaBareLabel
    exp_alerts: [{exp_labels: {alertstate: pending, job: x, severity: page}}]
  - eval_time: 5m
    alertname: ViaReEmit
    exp_alerts: [{exp_labels: {job: x, severity: page}}]
